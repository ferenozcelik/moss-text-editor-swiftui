name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          xcodebuild test -scheme MossTextEditor -destination "id=$DEVICE" -quiet
      - name: Build example app
        run: |
          xcodebuild build -workspace MossTextEditor.xcworkspace -scheme MossTextEditorExample \
            -destination 'generic/platform=iOS Simulator' -quiet
